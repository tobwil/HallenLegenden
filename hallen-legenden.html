<title>Hallen-Legenden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#07060b; --panel:#14111d; --panel2:#201a2e; --ink:#f3ead6; --dim:#9b90ad; --mute:#6e6680;
  --gold:#ffc83a; --hot:#ff4f3a; --cyan:#7cf2ff; --green:#3ddc84; --line:#3a2f4d;
  --pix:'Press Start 2P', ui-monospace, Menlo, monospace; --term:'VT323', ui-monospace, Menlo, monospace;
}
html,body{height:100%}
body{background:var(--bg) radial-gradient(ellipse at 50% 30%,#1a1430 0%,#07060b 70%);color:var(--ink);font-family:var(--term);font-size:20px;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-inline:16px;box-sizing:border-box;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#wrap{position:relative;width:min(100%, calc((100vh - 24px) * var(--ar, 16 / 9)));width:min(100%, calc((100dvh - 24px) * var(--ar, 16 / 9)));aspect-ratio:var(--ar, 16 / 9);max-width:100%;background:#000;
  box-shadow:0 0 0 3px #2a2140,0 0 0 6px #000,0 30px 80px rgba(0,0,0,.7),0 0 120px rgba(255,200,58,.06)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.07) 2px 3px),radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(0,0,0,.32) 100%)}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;touch-action:pan-y;overscroll-behavior:contain;padding:3%;box-sizing:border-box;overflow:auto;
  background:linear-gradient(rgba(7,6,11,.35),rgba(7,6,11,.82))}
#menu.clear{background:linear-gradient(rgba(7,6,11,0),rgba(7,6,11,.55) 70%)}
#menu[hidden]{display:none}
.panel{background:var(--panel);border:3px solid var(--ink);box-shadow:6px 6px 0 #000,inset 0 0 0 3px var(--panel2);
  padding:clamp(10px,2vw,20px);width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;flex:1 1 0;min-height:0;max-height:100%;overflow:auto}
.panel > *{flex-shrink:0}
/* kurze Menüs: gleiche Fenstergröße, Inhalt schmal und mittig */
.panel.narrow{padding-inline:max(clamp(10px,2vw,20px),calc((100% - 600px) / 2))}
.panel.narrow > :first-child{margin-top:auto}
.panel.narrow > :last-child{margin-bottom:auto}
.title{display:flex;flex-direction:column;align-items:center;gap:clamp(10px,2.5vw,22px);text-align:center}
.logo{font-family:var(--pix);font-size:clamp(22px,6.4vw,64px);line-height:1.05;margin:0;color:var(--gold);letter-spacing:.02em;position:relative;
  text-shadow:0 4px 0 #c96a12,0 8px 0 #7a2c0c,0 12px 0 #000,0 0 40px rgba(255,200,58,.35);animation:bob 3s ease-in-out infinite}
.logo span{display:block;font-size:.42em;color:var(--ink);text-shadow:0 3px 0 var(--hot),0 6px 0 #000;letter-spacing:.3em;margin-top:.4em}
.logo::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
  mix-blend-mode:overlay;background-size:300% 100%;animation:shine 3.2s linear infinite;pointer-events:none}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@keyframes bob{50%{transform:translateY(-4px)}}
.press{font-family:var(--pix);font-size:clamp(10px,1.6vw,14px);color:var(--ink);animation:blink 1s steps(2) infinite;background:none;border:none;box-shadow:none;padding:8px}
@keyframes blink{50%{opacity:0}}
.sub{font-family:var(--term);font-size:clamp(17px,2.4vw,24px);color:var(--dim);margin:0}
.legal{font-family:var(--term);font-size:16px;color:var(--mute);margin:0;max-width:60ch}
h2{font-family:var(--pix);font-size:clamp(11px,1.7vw,15px);color:var(--gold);margin:0;letter-spacing:.06em}
h3{font-family:var(--pix);font-size:10px;color:var(--dim);margin:0;letter-spacing:.08em;font-weight:normal}
.btns{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
button{font-family:var(--pix);font-size:clamp(9px,1.4vw,12px);color:var(--ink);background:var(--panel2);border:2px solid var(--ink);
  padding:10px 12px;cursor:pointer;box-shadow:3px 3px 0 #000;text-align:left;letter-spacing:.04em}
button:hover,button:focus-visible{background:var(--gold);color:#1a1205;outline:none}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
button.main{background:var(--hot)}
button.main:hover,button.main:focus-visible{background:var(--gold)}
button.small{padding:6px 8px;font-size:clamp(8px,1.1vw,10px)}
button.on{background:var(--gold);color:#1a1205}
.menu-list button{display:flex;justify-content:space-between;gap:12px}
.menu-list button i{font-style:normal;color:var(--mute);font-family:var(--term);font-size:18px;letter-spacing:0}
.menu-list button:hover i,.menu-list button:focus-visible i{color:#5a3d00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;text-align:center;font-size:8px;line-height:1.3}
.tbtn img{width:36px;height:36px;image-rendering:pixelated}
.tbtn.sel-a{outline:3px solid var(--gold);outline-offset:-3px}
.tbtn.sel-b{outline:3px solid var(--cyan);outline-offset:-3px}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
@media (max-width:560px){.duel{grid-template-columns:1fr}.duel .vs{flex-direction:row;justify-content:center;font-size:12px}.duel .vs:not(:has(.pvprev)){display:none}.duel .pvprev{flex-direction:row;align-items:center;gap:8px}}
.tcard{border:2px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px;background:#0d0b14;cursor:pointer}
.tcard.active{border-color:var(--gold)}
.tcard.b.active{border-color:var(--cyan)}
.tname{font-family:var(--pix);font-size:clamp(9px,1.2vw,11px);line-height:1.4;display:flex;align-items:center;gap:8px}
.tname img{width:32px;height:32px;image-rendering:pixelated;flex:none}
.vs{font-family:var(--pix);font-size:18px;color:var(--gold);align-self:center;text-shadow:3px 3px 0 #000;display:flex;flex-direction:column;align-items:center;gap:10px}
/* Vorschau: Stärkevergleich */
.pv{display:flex;gap:10px;align-items:flex-end}
.tcard.b .pv{flex-direction:row-reverse;text-align:right}
.pvspr{width:72px;height:112px;image-rendering:pixelated;flex:none;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.6))}
.pvinfo{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.tcard.b .pvinfo{align-items:flex-end}
.pvrec{font-family:var(--pix);font-size:9px;color:var(--cyan);line-height:1.4}
.pvform{display:flex;gap:3px}
.pvform i{width:16px;height:16px;font-style:normal;font-family:var(--pix);font-size:7px;display:flex;align-items:center;justify-content:center;background:#2a2438;color:#0d0b14;border:1px solid #000}
.pvform i.w{background:var(--green)}.pvform i.d{background:var(--gold)}.pvform i.l{background:var(--hot)}
.pvst{display:flex;gap:6px;align-items:center;font-family:var(--pix);font-size:7px;color:var(--dim)}
.tcard.b .pvst{flex-direction:row-reverse}
.pvst span{min-width:7.5em}.tcard.b .pvst span{text-align:right}
.pvst b{display:flex;gap:1px}
.pvtop{font-size:16px;color:var(--mute);line-height:1.1}
.pvprev{font-family:var(--pix);font-size:7px;color:var(--dim);text-align:center;text-shadow:none;display:flex;flex-direction:column;gap:4px}
.pvprev b{font-size:12px;color:var(--ink);font-weight:normal}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;font-size:18px;align-items:center}
.bar{height:8px;background:#2a2238}.bar i{display:block;height:100%;background:var(--gold)}
.tag{font-family:var(--pix);font-size:9px;color:var(--dim)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:19px;font-variant-numeric:tabular-nums}
th{font-family:var(--pix);font-size:8px;color:var(--dim);text-align:right;padding:4px 6px;font-weight:normal;white-space:nowrap}
td{padding:2px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}
tr.me td{color:var(--gold)}
tr.zone-a td:first-child{box-shadow:inset 3px 0 0 var(--green)}
tr.zone-d td:first-child{box-shadow:inset 3px 0 0 var(--hot)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:19px}
.keys b{font-family:var(--pix);font-size:9px;color:var(--gold);font-weight:normal;padding-top:4px;white-space:nowrap}
.res{font-family:var(--pix);font-size:clamp(18px,4vw,32px);text-align:center;margin:0}
.muted{color:var(--dim);margin:0}
.potm{display:flex;gap:12px;align-items:center;border:2px solid var(--gold);padding:8px;background:#1a1405}
.potm canvas{width:80px;height:80px;image-rendering:pixelated;border:2px solid #000}
.diffhint{text-align:center;color:var(--gold);font-family:var(--pix);font-size:clamp(9px,1.4vw,12px);margin:8px 0 0}
.ed{display:grid;grid-template-columns:auto 1fr 70px;gap:6px 8px;align-items:center}
input,select{font-family:var(--term);font-size:20px;background:#0d0b14;color:var(--ink);border:2px solid var(--line);padding:4px 6px;min-width:0}
input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}

/* Karriere: breites Panel, kompakte Tabellen */
.panel.wide{max-width:none}
/* Karriere-Statistik */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.kpi{background:var(--panel2);border:2px solid var(--line);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi span{font-family:var(--pix);font-size:8px;color:var(--dim);letter-spacing:.08em}
.kpi b{font-family:var(--pix);font-size:clamp(14px,2vw,20px);color:var(--ink);font-weight:normal;line-height:1.3}
.kpi i{font-style:normal;color:var(--mute);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi b.chips{display:flex;gap:3px;font-size:10px}
.fchip{font-style:normal;width:20px;height:20px;display:inline-grid;place-items:center;color:#07060b;font-family:var(--pix);font-size:9px}
.fchip.fS{background:var(--green)}.fchip.fU{background:var(--dim)}.fchip.fN{background:var(--hot)}
.poschart{width:100%;height:auto;display:block}
.poschart text{font-family:var(--pix);font-size:8px;fill:var(--mute)}
.poschart .gl{stroke:var(--line);stroke-width:1}
.poschart .pl{fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.poschart .pt circle{fill:var(--gold);stroke:var(--panel);stroke-width:2}
.poschart .pt circle.hit{fill:transparent;stroke:none}
.poschart .pt:hover circle:first-child{fill:var(--ink)}
.stat2{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;align-items:start}
.stat2 > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.stt td.num,.stt th.num{text-align:right}
.stt td.lbl{text-align:left}
.hm-only{display:none}
@media (max-width:600px){table.hist .hm-only{display:inline}}
table.fin{max-width:520px}
.stt td.barc{width:30%}
.sbar{display:block;height:6px;background:var(--gold);opacity:.8}
.stt tr.me .sbar{background:var(--hot)}
@media (max-width:760px){.stat2{grid-template-columns:1fr}}
/* Europapokal */
.egroups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.egroup{display:flex;flex-direction:column;gap:4px;min-width:0}
.egroup tr.zone-a td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.eres{margin:0;font-size:15px;color:var(--mute);line-height:1.35}
.eres .me{color:var(--gold)}
.bracket.ebr{grid-template-columns:repeat(3,minmax(92px,1fr)) minmax(80px,.8fr)}
@media (max-width:600px){.egroups{grid-template-columns:1fr}}
/* Pokal-Turnierbaum */
.bracket{display:grid;grid-template-columns:repeat(5,minmax(92px,1fr)) minmax(80px,.8fr);gap:12px;overflow-x:auto;padding-bottom:4px}
.bcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.bties{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:4px}
.tie{position:relative;border:2px solid var(--line);background:var(--panel2);font-size:15px;line-height:1}
.tie.myt{border-color:var(--gold)}
.tie em{position:absolute;right:-2px;top:-9px;font-style:normal;font-family:var(--pix);font-size:7px;color:var(--cyan);background:var(--panel);padding:1px 2px}
.bt{display:flex;justify-content:space-between;gap:6px;padding:1px 6px}
.bt + .bt{border-top:1px solid var(--line)}
.bt.out{color:var(--mute)}
.bt.win{color:var(--ink);font-weight:bold}
.bt.mine span{color:var(--gold)}
.bt.tbd{color:var(--mute)}
.champ .tie{border-color:var(--gold)}
table.sqt{font-size:17px}
.sqt th,.sqt td{padding:2px 5px}
.sqt td:nth-child(2){white-space:normal}
button.link{background:none;border:none;box-shadow:none;padding:0;font-family:var(--term);font-size:18px;color:inherit;text-decoration:underline dotted 1px;text-underline-offset:3px;cursor:pointer;letter-spacing:0}
button.link:hover,button.link:focus-visible{background:none;color:var(--gold)}
.age{font-size:15px;color:var(--mute);margin-left:6px}
.tal{font-family:var(--pix);font-size:7px;color:var(--cyan)}
/* Erfolge: Trophäenschrank, Teilen-Karte */
.tshelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tshelves.mini{grid-template-columns:repeat(auto-fit,minmax(120px,170px));justify-content:center}
.tshelf{background:var(--panel2);border:2px solid var(--line);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.tshelf.won{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,200,58,.15)}
.tshelf .tro{image-rendering:pixelated}
.tshelf b{font-family:var(--pix);font-weight:normal;font-size:14px;color:var(--gold)}
.tshelf span{font-family:var(--pix);font-size:8px;color:var(--ink);line-height:1.4}
.tshelf i{font-style:normal;font-size:16px;color:var(--mute)}
.tshelves.ms{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tshelves.ms .tshelf{padding:8px 6px}
.tshelves.ms .tshelf:not(.won){opacity:.75}
.tshelves.ms .tshelf i{font-size:15px;line-height:1.15}
.jobs{border:3px solid var(--hot);background:rgba(255,79,58,.08);padding:10px 12px;display:grid;gap:8px}
.jobs h3{color:var(--hot);margin:0}
.sharecard{display:block;width:min(100%,360px);height:auto;margin:0 auto;image-rendering:pixelated;border:3px solid var(--ink);box-shadow:5px 5px 0 #000}
a.btn-a{font-family:var(--pix);font-size:clamp(9px,1.4vw,12px);color:#1a1205;background:var(--gold);border:2px solid var(--ink);padding:10px 14px;text-decoration:none;box-shadow:3px 3px 0 #000;display:inline-flex;align-items:center}
.pot{white-space:nowrap}.pot-up{color:var(--cyan)}.pot-down{color:var(--mute)}
.inj{font-family:var(--pix);font-size:7px;color:#fff;background:var(--hot);padding:1px 3px}
.gkc{text-align:center!important;color:var(--dim)}
.pdet{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
/* Spielerkarte: Kopf mit Porträt, zwei Kästen (Spieler | Werte oder Statistik), Knopfleiste */
.pcard{display:flex;flex-direction:column;gap:10px}
.pchead{display:flex;gap:14px;align-items:center}
.pchead canvas{width:96px;height:96px;image-rendering:pixelated;border:3px solid #000;box-shadow:4px 4px 0 #000;flex:none}
.pchead h2{margin:0}
.pchead p{margin:4px 0 0}
.pcgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.pcgrid{grid-template-columns:1fr}}
.pcbox{border:3px solid var(--ink);padding:8px 12px 10px;min-width:0}
.pcbox h3{margin:-20px 0 6px;display:inline-block;background:var(--panel,#120f1c);padding:0 6px;font-size:10px}
.pcbox dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:18px;align-items:center}
.pcbox dt{color:var(--dim)}
.pcbox dd{margin:0;min-width:0}
.pcinfo{margin:6px 0 0;font-size:15px;line-height:1.3}
.pcst{display:inline-flex;gap:1px;vertical-align:-1px}
.cbadge{display:inline-block;font-family:var(--pix);font-size:8px;line-height:1;padding:3px 4px 2px;background:var(--gold);color:#000;vertical-align:2px;margin-left:4px}
table.pcstat td.lbl{color:var(--dim)}
.pdet canvas{width:120px;height:120px;image-rendering:pixelated;border:3px solid #000;box-shadow:4px 4px 0 #000;flex:none}
.pdet-info{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}
/* Zeitung */
.paper{--ink:#1d1a16;background:#efe6cf linear-gradient(rgba(0,0,0,.025) 1px,transparent 1px) 0 0/100% 4px;color:#1d1a16;border:3px solid #000;box-shadow:5px 5px 0 #000;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.paper p{margin:0;font-size:18px;line-height:1.15}
.np-mast{font-family:var(--pix);font-size:clamp(16px,3vw,26px);text-align:center;letter-spacing:.06em;border-bottom:4px double #1d1a16;padding-bottom:6px}
.np-date{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:16px;border-bottom:1px solid #1d1a16;padding-bottom:4px;color:#4a4236}
.np-head{font-family:var(--pix);font-size:clamp(13px,2.2vw,20px);line-height:1.3;margin:4px 0 0;text-wrap:balance}
.np-lead{font-size:20px!important}
.np-ticker{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:16px;background:#1d1a16;color:#efe6cf;padding:3px 8px}
.np-ticker .me{color:#ffc83a}
.np-grid{display:grid;grid-template-columns:1.2fr 1fr 1.1fr;gap:10px}
@media (max-width:700px){.np-grid{grid-template-columns:1fr}}
.np-box{border-top:3px solid #1d1a16;padding-top:6px;display:flex;flex-direction:column;gap:6px}
.np-box h4,.np-sec{font-family:var(--pix);font-size:9px;margin:4px 0 0;letter-spacing:.06em}
.np-vs{display:flex;align-items:center;gap:10px}
.np-vs img{width:36px;height:36px;image-rendering:pixelated}
.np-vs b{font-family:var(--pix);font-size:9px}
.paper button{box-shadow:2px 2px 0 #000;color:#f3ead6}
.paper button:hover,.paper button:focus-visible,.paper button.on{color:#1a1205}
.np-meter{height:8px;background:#cfc3a3;border:1px solid #1d1a16}.np-meter i{display:block;height:100%;background:#1d1a16}
.paper table td{color:#1d1a16;border-top-color:#c9bd9e}
.paper tr.me td{color:#a3170d;font-weight:bold}
.paper .sqt.mini{font-size:16px}
.paper tr.zone-a td:first-child{box-shadow:inset 3px 0 0 #2a8a52}
.paper tr.zone-d td:first-child{box-shadow:inset 3px 0 0 #c8321f}
.np-news{max-height:120px;overflow-y:auto;border:1px solid #c9bd9e;padding:6px 8px;display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.25)}
.np-news p{font-size:17px!important;border-bottom:1px dotted #c9bd9e;padding-bottom:3px}
@media (max-width:900px){table.sqt{font-size:15px}.sqt th,.sqt td{padding:2px 3px}.age{display:none}}
@media (max-width:360px){table.sqt{font-size:13px}.sqt th,.sqt td{padding:2px 2px}}   /* sehr kleine Handys (320 px): Statistik-Tabellen passen ohne Überstand */
/* Menü-Navigation & Mobile */
.tblwrap,.np-news{touch-action:pan-x pan-y}
.navhint{margin:0;font-family:var(--pix);font-size:8px;color:var(--mute);text-align:center;background:rgba(7,6,11,.75);padding:5px 10px;flex:none}
button:focus-visible{box-shadow:0 0 0 3px var(--cyan),3px 3px 0 #000}
@media (max-width:760px), (max-height:540px){
  #menu{position:fixed;inset:0;z-index:20;justify-content:flex-start;background:rgba(7,6,11,.95);
